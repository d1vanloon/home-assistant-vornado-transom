name: Bump version

on:
  workflow_dispatch:
    inputs:
      part:
        description: Part of the version to bump
        required: false
        default: minor
        type: choice
        options:
          - minor
          - patch
          - major

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version
        run: python -m tools.version_bump --part "${{ inputs.part }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUMP_RUN_ID: ${{ github.run_id }}
